<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Air checkout (widget host page)</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #eef1f7;
        margin: 0;
      }
      header {
        background: #1d3e8a;
        color: #fff;
        padding: 16px 24px;
        font-weight: bold;
      }
      main {
        max-width: 560px;
        margin: 24px auto;
        padding: 0 16px;
      }
      section {
        background: #fff;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .muted {
        color: #555;
        font-size: 14px;
      }
      #log {
        font-family: monospace;
        font-size: 12px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <header>Mock Air · Checkout</header>
    <main>
      <section>
        <strong>MK101 Lagos → Abuja</strong>
        <p class="muted">Tomorrow 09:30 · 1 adult · ₦98,500</p>
      </section>

      <!-- The airline places this before the passenger details step (CHN-01). -->
      <div id="airwheels-transfer"></div>

      <section>
        <strong>Passenger details</strong>
        <p class="muted">(The airline's own form continues here.)</p>
        <p id="log">Widget state: not added</p>
      </section>
    </main>
    <script type="module">
      import { mount } from './src/index.ts';
      mount({
        el: '#airwheels-transfer',
        airline: 'MOCK',
        onChange: (s) =>
          (document.getElementById('log').textContent = 'Widget state: ' + JSON.stringify(s)),
      });
    </script>
  </body>
</html>
