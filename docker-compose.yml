# Local infrastructure. App processes run on the host via `pnpm dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airwheels
      POSTGRES_PASSWORD: airwheels
      POSTGRES_DB: airwheels
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airwheels']
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      retries: 20
volumes:
  pgdata:
